name: Release

# Tag-driven release: v* tag -> version check -> tests -> 3-platform binaries
# -> GitHub Release (with checksums) -> PyPI publish.
# PyPI publishing uses Trusted Publishing (no token); configure the publisher
# on pypi.org for this repository, or set the PYPI_API_TOKEN secret to use
# the token path instead.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  check-version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Assert version markers agree with the tag
        run: uv run python scripts/check_version.py "${GITHUB_REF_NAME#v}"

  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev --all-extras
      - name: Run tests
        run: uv run pytest -q

  build-binaries:
    name: Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [check-version, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev --all-extras
      - name: Build binary with PyInstaller
        run: uv run python scripts/build_binary.py
      - name: Verify binary runs
        shell: bash
        run: |
          BIN=$(ls dist/opencode-rate-limiter-*)
          echo "Verifying $BIN"
          "$BIN" --version
          "$BIN" check --json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist/opencode-rate-limiter-*
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries]
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true
      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*

  pypi-publish:
    name: PyPI publish
    runs-on: ubuntu-latest
    needs: [check-version, test]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Build sdist and wheel
        run: uv build
      - name: Detect publishing mode
        id: mode
        run: |
          if [ -n "${{ secrets.PYPI_API_TOKEN }}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to PyPI (Trusted Publishing)
        if: steps.mode.outputs.mode == 'trusted'
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish to PyPI (token fallback)
        if: steps.mode.outputs.mode == 'token'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
