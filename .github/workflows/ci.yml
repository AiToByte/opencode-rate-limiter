name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-type:
    name: Lint + typecheck (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev --all-extras
      - name: Version markers agree
        run: uv run python scripts/check_version.py
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy .

  test:
    name: Pytest (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: uv sync --dev --all-extras
      - name: Run tests
        run: uv run pytest -q

  e2e-smoke:
    name: E2E smoke (ubuntu / py3.11)
    runs-on: ubuntu-latest
    needs: [lint-type, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev --all-extras
      - name: CLI smoke (help / version / check / completions)
        run: |
          uv run opencode-rate-limiter --help
          uv run opencode-rate-limiter --version
          uv run opencode-rate-limiter check --json > /dev/null
          uv run opencode-rate-limiter completions bash > /dev/null
          uv run opencode-rate-limiter completions zsh > /dev/null
          uv run opencode-rate-limiter completions fish > /dev/null
          uv run opencode-rate-limiter completions powershell > /dev/null
